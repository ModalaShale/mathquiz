<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz: Before, Middle, After</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 3rem;
        }
        .question {
            font-size: 2rem;
            margin: 10px 0;
        }
        input {
            font-size: 2rem;
            width: 60px;
            padding: 10px;
            margin: 0 10px;
            text-align: center;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            color: #fff;
            background-color: #4caf50;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .result, .feedback {
            font-size: 2rem;
            margin-top: 20px;
        }
        footer {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #555;
        }
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <img src="logo.png" alt="Logo" class="logo">
        <h1>Math Quiz: Before, Middle, After</h1>
        <div class="question" id="question"></div>
        <div>
            <input type="number" id="number1" disabled>
            <input type="number" id="answer" required>
            <input type="number" id="number3" disabled>
        </div>
        <button class="submit-btn" onclick="checkAnswer()">Submit</button>
        <div class="feedback" id="feedback"></div>
        <div class="result" id="result"></div>
    </div>
    <footer>
        anandasagara.org
    </footer>

    <script>
        const generateProblems = (count) => {
            let problems = [];
            for (let i = 0; i < count; i++) {
                let a = Math.floor(Math.random() * 10);
                let type = Math.floor(Math.random() * 3); // 0 for before, 1 for middle, 2 for after
                let problem;
                if (type === 0) {
                    problem = { numbers: [``, a, a + 1], answer: a - 1 };
                } else if (type === 1) {
                    problem = { numbers: [a, ``, a + 2], answer: a + 1 };
                } else {
                    problem = { numbers: [a, a + 1, ``], answer: a + 2 };
                }
                problems.push(problem);
            }
            return problems;
        };

        const problems = generateProblems(10);
        let currentProblemIndex = 0;
        let score = 0;

        function displayProblem() {
            const problem = problems[currentProblemIndex];
            document.getElementById('number1').value = problem.numbers[0];
            document.getElementById('answer').value = '';
            document.getElementById('number3').value = problem.numbers[2];
            document.getElementById('answer').focus();
            document.getElementById('feedback').textContent = '';
        }

        function checkAnswer() {
            const problem = problems[currentProblemIndex];
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedbackElement = document.getElementById('feedback');
            
            if (userAnswer === problem.answer) {
                score++;
                feedbackElement.textContent = 'Correct!';
            } else {
                feedbackElement.textContent = 'Incorrect, please try again.';
            }

            currentProblemIndex++;
            if (currentProblemIndex < problems.length) {
                displayProblem();
            } else {
                document.getElementById('question').textContent = '';
                document.getElementById('number1').style.display = 'none';
                document.getElementById('answer').style.display = 'none';
                document.getElementById('number3').style.display = 'none';
                document.querySelector('.submit-btn').style.display = 'none';
                document.getElementById('result').textContent = `You scored ${score} out of ${problems.length}!`;
            }
        }

        window.onload = displayProblem;
    </script>
</body>
</html>
